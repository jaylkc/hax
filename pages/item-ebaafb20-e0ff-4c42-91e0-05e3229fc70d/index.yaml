  <h3>Disrupting Ineffective Structures</h3>

  <p>When existing systems fail the people who depend on them, the most
  effective response is rarely to advocate louder within those systems.
  It&#8217;s time to prototype and demonstrate something different. That might
  mean repurposing underutilized resources, deploying open-source technology to
  replace the system that excludes entire populations, or convening stakeholders
  across sectors who had intentionally been kept in different rooms.</p>

  <ol><li>Identify which structures are genuinely inflexible and which only
  appear that way</li><li>Prototype alternatives in partnership with the people
  most affected</li><li>Measure what changes, refine what doesn't, and document
  both rigorously</li><li>Scale what works with the relationships and the
  evidence to sustain progress</li></ol>

